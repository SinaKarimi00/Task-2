<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VideoHub MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6f3;--fg:#2b2230;--card:#ffffff;--bd:#eaded9;--ac:#b4547a;--ac2:#e39a7b;--soft:#f8e8ec;--sh:0 6px 20px rgba(120,60,80,.09);--err:#c62828;--ok:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1620;--fg:#f3e9ee;--card:#2a2130;--bd:#41334a;--ac:#e58bb0;--ac2:#f0b08f;--soft:#382b40;--sh:none;--err:#ff7b72;--ok:#6fdc8c}}
:root[data-theme="dark"]{--bg:#1c1620;--fg:#f3e9ee;--card:#2a2130;--bd:#41334a;--ac:#e58bb0;--ac2:#f0b08f;--soft:#382b40;--sh:none;--err:#ff7b72;--ok:#6fdc8c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:Tahoma,system-ui,sans-serif;max-width:820px;margin:auto;padding:14px}
nav{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:14px}
button,input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;max-width:100%}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.err{color:var(--err)}.ok{color:var(--ok)}
.prev{background:#000;color:#bbb;border-radius:10px;height:180px;display:flex;align-items:center;justify-content:center;margin:8px 0}
small{opacity:.75}input,textarea,select{width:100%;margin:4px 0}
.note{font-size:.85em;border:1px dashed var(--bd);border-radius:8px;padding:8px;margin-bottom:10px;opacity:.85}
body{font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;line-height:1.9}
.brand{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-size:22px}
.brand b{font-size:1.35em;font-weight:800}.brand small{display:block;line-height:1.4}
nav{border:0;background:var(--card);box-shadow:var(--sh);border-radius:18px;padding:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
button,input,select,textarea{border-radius:12px;background:var(--card);border-color:var(--bd)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac2);border-color:transparent}
nav button{border:0;background:transparent}nav button:hover{background:var(--soft)}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff;font-weight:600}
.card{border-radius:18px;box-shadow:var(--sh);padding:14px;transition:transform .15s}.card:hover{transform:translateY(-2px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.grid .card{margin:0;padding:0;overflow:hidden}.cb{padding:12px 14px 14px}
.th{height:110px;display:grid;place-items:center;font-size:34px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.th.text{background:linear-gradient(135deg,#7f8fd6,#a9c4e6)}.th.mixed{background:linear-gradient(135deg,#6fb59a,#c7dc9b)}
.tag{display:inline-block;background:var(--soft);color:var(--ac);border-radius:99px;padding:0 10px;font-size:.8em}
.chips button{border-radius:99px}.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.prev{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:20px;height:220px;font-size:1.15em}
.note{background:var(--soft);border:0;border-radius:12px}
h2{margin:.3em 0;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stats .card{margin:0}.big{font-size:1.5em;font-weight:800;color:var(--ac)}
.br{display:grid;grid-template-columns:minmax(80px,1.2fr) 3fr auto;align-items:center;gap:8px;margin:6px 0;font-size:.9em}
.br i{display:block;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2));min-width:3px}
.cols{display:flex;gap:8px;align-items:flex-end;height:160px;margin-top:10px}.cols>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.cols b{font-size:.75em}.cols i{display:block;width:100%;max-width:34px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--ac),var(--ac2));min-height:2px}
.tw{overflow-x:auto;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:.9em}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:var(--ac)}
</style></head><body>
<div class="note">نسخهٔ نمایشی: داده‌ها فقط در مرورگر خودتان ذخیره می‌شوند و پرداخت شبیه‌سازی است. نسخهٔ واقعی (بک‌اند Django) جداگانه ارائه شده است.</div>
<div class="brand"><div class="logo">✦</div><div><b>VideoHub</b><small>آموزش‌های تخصصی، یک‌جا و مرتب</small></div></div>
<nav id="nav"></nav><div id="app"></div>
<script>
const K="vh_mvp_demo";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){return{cur:null,users:{},nid:20,
cats:[{id:1,name:"Unity",p:0},{id:2,name:"C#",p:1},{id:3,name:"Shader",p:1},{id:4,name:"طراحی",p:0},{id:5,name:"رابط کاربری",p:4}],
items:[{id:1,t:"مقدمه‌ای بر C# در Unity",d:"آشنایی با متغیرها، کلاس‌ها و اسکریپت‌نویسی در Unity.",c:2,k:"video"},
{id:2,t:"Shader Graph از صفر",d:"ساخت اولین شیدر با Shader Graph و درک نودهای پایه.",c:3,k:"video"},
{id:3,t:"چک‌لیست بهینه‌سازی موبایل",d:"مجموعه نکات متنی برای بهبود فریم‌ریت روی موبایل.",c:1,k:"text"},
{id:4,t:"طراحی UI بازی موبایل",d:"ویدیو و جزوهٔ متنی دربارهٔ اصول طراحی رابط کاربری.",c:5,k:"mixed"},
{id:5,t:"الگوهای طراحی در بازی‌سازی",d:"Object Pool، Observer و State Machine با مثال.",c:2,k:"video"}],
pk:[{id:1,n:"پکیج ۳ دانلودی",q:3},{id:2,n:"پکیج ۵ دانلودی",q:5},{id:3,n:"پکیج ۱۰ دانلودی",q:10}]}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let view="home",arg=null,fc=0,msg="";
const U=()=>S.cur&&S.users[S.cur];
const rem=u=>u.pk.reduce((a,p)=>a+p.q-p.u,0);
const cname=id=>{const c=S.cats.find(x=>x.id==id);return c?(c.p?cname(c.p)+" / ":"")+c.name:""};
const KN={video:"ویدیو",text:"متن",mixed:"ترکیبی"};
function go(v,a){view=v;arg=a;msg="";render()}
function say(m,ok){msg=`<p class="${ok?'ok':'err'}">${m}</p>`;render()}
function nav(){const u=U();document.getElementById("nav").innerHTML=
`<button onclick="go('home')">خانه</button><button onclick="go('buy')">خرید پکیج</button>`+
(u?`<button onclick="go('profile')">پروفایل (${esc(S.cur)}) – سهمیه: ${rem(u)}</button><button onclick="S.cur=null;save();go('home')">خروج</button>`
:`<button onclick="go('auth')">ورود / ثبت‌نام</button>`)+`<button onclick="go('admin')">پنل مدیریت</button>`}
function render(){nav();const f={home,detail,profile,auth,buy,admin}[view];
document.getElementById("app").innerHTML=msg+f();window.scrollTo(0,0)}
function card(i){const ic={video:"▶",text:"✎",mixed:"✦"}[i.k];return`<div class="card"><div class="th ${i.k}">${ic}</div><div class="cb"><span class="tag">${KN[i.k]}</span> <small>${esc(cname(i.c))}</small>
<div><b>${esc(i.t)}</b></div><div style="margin-top:8px"><button class="p" onclick="go('detail',${i.id})">مشاهده</button></div></div></div>`}
function home(){const top=S.cats.filter(c=>!c.p);
const l=S.items.filter(i=>!fc||i.c==fc||(S.cats.find(c=>c.id==i.c)||{}).p==fc);
return`<div class="row chips" style="margin-bottom:14px"><button class="${fc?'':'on'}" onclick="fc=0;render()">همه</button>${top.map(c=>`<button class="${fc==c.id?'on':''}" onclick="fc=${c.id};render()">${esc(c.name)}</button>`).join("")}</div><div class="grid">`+
(l.map(card).join("")||"<p>محتوایی نیست.</p>")+`</div>`}
function detail(){const i=S.items.find(x=>x.id==arg),u=U(),own=u&&u.ar.includes(i.id);
return`<h2>${esc(i.t)}</h2><small>${KN[i.k]} – ${esc(cname(i.c))}</small>
<div class="prev">▶ پیش‌نمایش (نمونه)</div><p>${esc(i.d)}</p>
<button class="p" onclick="dl(${i.id})">${own?"دانلود مجدد (رایگان)":"دانلود (کسر یک سهمیه)"}</button>`}
function dl(id){const u=U();if(!u)return go("auth");const i=S.items.find(x=>x.id==id);
if(!u.ar.includes(id)){const p=u.pk.find(p=>p.u<p.q);if(!p)return say("سهمیه دانلود شما تمام شده است. پکیج جدید بخرید.");
p.u++;u.ar.push(id);(S.dls=S.dls||[]).push({u:S.cur,i:id,t:Date.now()});save()}
const b=new Blob(["فایل نمونه: "+i.t],{type:"text/plain"}),a=document.createElement("a");
a.href=URL.createObjectURL(b);a.download="content-"+id+".txt";a.click();say("دانلود انجام شد.",1)}
function profile(){const u=U();if(!u)return auth();
return`<h2>${esc(S.cur)}</h2><p>سهمیه باقی‌مانده: <b>${rem(u)}</b></p><h3>آرشیو من</h3>`+
(u.ar.map(id=>{const i=S.items.find(x=>x.id==id);return i?`<div class="card">${esc(i.t)} <button onclick="dl(${id})">دانلود مجدد</button></div>`:""}).join("")||"<p>هنوز چیزی دانلود نکرده‌اید.</p>")}
function auth(){return`<h2>ورود / ثبت‌نام</h2><input id="un" placeholder="نام کاربری"><input id="pw" type="password" placeholder="رمز عبور">
<div class="row"><button class="p" onclick="login()">ورود</button><button onclick="reg()">ثبت‌نام</button></div>`}
function reg(){const n=un.value.trim(),p=pw.value;if(!n||!p)return say("نام کاربری و رمز را وارد کنید.");
if(S.users[n])return say("این نام کاربری وجود دارد.");S.users[n]={p,pk:[],ar:[]};S.cur=n;save();go("home")}
function login(){const n=un.value.trim(),u=S.users[n];if(!u||u.p!==pw.value)return say("نام کاربری یا رمز اشتباه است.");S.cur=n;save();go("home")}
function buy(){return`<h2>پکیج‌های دانلود</h2>`+S.pk.map(p=>`<div class="card row"><b>${esc(p.n)}</b><small>${p.q} دانلود – ${tm(p.q*30000)} تومان</small>
<button class="p" onclick="pay(${p.id})">خرید (شبیه‌سازی)</button></div>`).join("")}
function pay(id){const u=U();if(!u)return go("auth");const p=S.pk.find(x=>x.id==id);u.pk.push({q:p.q,u:0});(S.orders=S.orders||[]).push({id:S.nid++,u:S.cur,n:p.n,q:p.q,pr:p.q*30000,t:Date.now()});save();say("پکیج فعال شد.",1)}
function adminOld(){const o=S.cats.map(c=>`<option value="${c.id}">${esc(cname(c.id))}</option>`).join("");
return`<div class="card"><b>دستهٔ جدید</b><input id="cn" placeholder="نام دسته">
<select id="cp"><option value="0">بدون والد (دستهٔ اصلی)</option>${o}</select><button onclick="addCat()">افزودن دسته</button></div>
<div class="card"><b>محتوای جدید</b><input id="ct" placeholder="عنوان"><textarea id="cd" placeholder="توضیحات"></textarea>
<select id="cc">${o}</select><select id="ck"><option value="video">ویدیو</option><option value="text">متن</option><option value="mixed">ترکیبی</option></select>
<button onclick="addItem()">افزودن محتوا</button></div><h3>محتواها</h3>`+
S.items.map(i=>`<div class="card row">${esc(i.t)} <button onclick="S.items=S.items.filter(x=>x.id!=${i.id});save();render()">حذف</button></div>`).join("")}
function addCat(){if(!cn.value.trim())return;S.cats.push({id:S.nid++,name:cn.value.trim(),p:+cp.value});save();say("دسته اضافه شد.",1)}
function addItem(){if(!ct.value.trim())return;S.items.push({id:S.nid++,t:ct.value.trim(),d:cd.value,c:+cc.value,k:ck.value});save();say("محتوا اضافه شد.",1)}
let at="dash";
const tm=n=>Number(n).toLocaleString("fa-IR"),fd=t=>new Date(t).toLocaleDateString("fa-IR");
function csv(name,rows){const b=new Blob(["\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click()}
function bars(d){const m=Math.max(1,...d.map(x=>x[1]));return d.map(x=>`<div class="br"><span>${esc(x[0])}</span><i style="width:${x[1]/m*100}%"></i><b>${tm(x[1])}</b></div>`).join("")||"<p><small>داده‌ای نیست.</small></p>"}
function cols(d){const m=Math.max(1,...d.map(x=>x[1]));return`<div class="cols">${d.map(x=>`<div><b>${tm(Math.round(x[1]/1000))}</b><i style="height:${x[1]/m*100}px"></i><small>${x[0]}</small></div>`).join("")}</div>`}
const by=(a,f)=>{const m={};a.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const urows=()=>Object.entries(S.users).map(([n,u])=>{const q=u.pk.reduce((a,p)=>a+p.q,0),x=u.pk.reduce((a,p)=>a+p.u,0);return[n,u.pk.length,q,x,q-x,u.ar.length]});
function admin(){const T=[["dash","داشبورد"],["orders","سفارش‌ها"],["users","کاربران"],["content","افزودن محتوا"]];
return`<h2>پنل مدیریت</h2><div class="row chips" style="margin-bottom:12px">${T.map(t=>`<button class="${at==t[0]?'on':''}" onclick="at='${t[0]}';render()">${t[1]}</button>`).join("")}</div>`+({dash:adDash,orders:adOrders,users:adUsers,content:adminOld}[at])()}
function adDash(){const O=S.orders||[],D=S.dls||[],us=Object.values(S.users);
const tq=us.reduce((a,u)=>a+u.pk.reduce((x,p)=>x+p.q,0),0),tu=us.reduce((a,u)=>a+u.pk.reduce((x,p)=>x+p.u,0),0);
const st=[["کاربران",us.length],["سفارش‌ها",O.length],["درآمد (تومان)",O.reduce((a,o)=>a+o.pr,0)],["دانلودها",D.length],["مصرف سهمیه",tq?tm(Math.round(tu/tq*100))+"٪":"—"]];
const days=[...Array(7)].map((_,j)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+j);const s=+d,e=s+864e5;return[d.toLocaleDateString("fa-IR",{month:"numeric",day:"numeric"}),O.filter(o=>o.t>=s&&o.t<e).reduce((a,o)=>a+o.pr,0)]});
return`<div class="stats">${st.map(s=>`<div class="card"><small>${s[0]}</small><div class="big">${typeof s[1]=="number"?tm(s[1]):s[1]}</div></div>`).join("")}</div>
<div class="card"><b>درآمد ۷ روز اخیر (هزار تومان)</b>${cols(days)}</div>
<div class="card"><b>فروش به تفکیک پکیج</b>${bars(by(O,o=>o.n))}</div>
<div class="card"><b>پردانلودترین محتوا</b>${bars(by(D,d=>(S.items.find(i=>i.id==d.i)||{t:"حذف‌شده"}).t).slice(0,6))}</div>
<div class="card"><b>دانلود به تفکیک دسته</b>${bars(by(D,d=>{const i=S.items.find(x=>x.id==d.i);return i?cname(i.c):"—"}))}</div>
<button onclick="demo()">افزودن داده‌های نمونه برای دیدن نمودارها</button>`}
function adOrders(){const O=(S.orders||[]).slice().reverse();
return`<div class="row" style="justify-content:space-between"><b>${tm(O.length)} سفارش</b><button class="p" onclick="exOrders()">دریافت CSV</button></div>
<div class="tw"><table><tr><th>تاریخ</th><th>کاربر</th><th>پکیج</th><th>مبلغ (تومان)</th></tr>${O.map(o=>`<tr><td>${fd(o.t)}</td><td>${esc(o.u)}</td><td>${esc(o.n)}</td><td>${tm(o.pr)}</td></tr>`).join("")||'<tr><td colspan=4>سفارشی ثبت نشده است.</td></tr>'}</table></div>`}
function exOrders(){csv("orders.csv",[["تاریخ","کاربر","پکیج","تعداد دانلود","مبلغ"],...(S.orders||[]).map(o=>[fd(o.t),o.u,o.n,o.q,o.pr])])}
function adUsers(){const R=urows();
return`<div class="row" style="justify-content:space-between"><b>${tm(R.length)} کاربر</b><button class="p" onclick="exUsers()">دریافت CSV</button></div>
<div class="tw"><table><tr><th>کاربر</th><th>پکیج</th><th>سهمیه</th><th>مصرف</th><th>باقی‌مانده</th><th>آرشیو</th></tr>${R.map(r=>`<tr>${r.map((v,i)=>`<td>${i?tm(v):esc(v)}</td>`).join("")}</tr>`).join("")||'<tr><td colspan=6>کاربری نیست.</td></tr>'}</table></div>`}
function exUsers(){csv("users.csv",[["کاربر","پکیج‌ها","کل سهمیه","مصرف‌شده","باقی‌مانده","آرشیو"],...urows()])}
function demo(){const N=["نگار","سارا","مینا","علی","رضا","هانیه"];S.orders=S.orders||[];S.dls=S.dls||[];
N.forEach(n=>{const u=S.users[n]=S.users[n]||{p:"demo",pk:[],ar:[]};const k=1+Math.floor(Math.random()*2);
for(let j=0;j<k;j++){const p=S.pk[Math.floor(Math.random()*S.pk.length)],t=Date.now()-Math.random()*6*864e5,pkg={q:p.q,u:0};u.pk.push(pkg);
S.orders.push({id:S.nid++,u:n,n:p.n,q:p.q,pr:p.q*30000,t});
for(let d=Math.floor(Math.random()*(p.q+1));d>0;d--){const it=S.items[Math.floor(Math.random()*S.items.length)];if(!it||u.ar.includes(it.id))continue;u.ar.push(it.id);pkg.u++;S.dls.push({u:n,i:it.id,t:Math.min(Date.now(),t+Math.random()*864e5)})}}});
save();say("داده‌های نمونه اضافه شد.",1)}
render();
</script></body></html>
